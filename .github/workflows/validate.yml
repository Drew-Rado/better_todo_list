# Runs Home Assistant's own "hassfest" checks (manifest.json shape, valid
# Python imports, etc.) and the HACS repository validator on every push -
# these catch most "why won't this install" problems before you even try
# it in a real Home Assistant instance.
name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
